<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solar System Journey for Sarvinoz</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(20, 20, 35, 0.7);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #f4f4f5;
            --accent: #00d2ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020205;
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-main);
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Centered Responsive UI Overlay */
        #ui-layer {
            position: absolute;
            inset: 0; /* top:0, left:0, right:0, bottom:0 */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through if clicking outside panels */
            padding: 20px;
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(255,255,255,0.05);
            width: 100%;
            max-width: 420px; /* Limits width on desktop, fills screen on mobile */
            pointer-events: auto; /* Re-enable clicks inside the panel */
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 1;
            transform: translateY(0) scale(1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .panel.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(40px) scale(0.95);
            position: absolute; /* Keeps it from affecting layout when hidden */
        }

        h1 {
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #a0d8ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 25px;
            font-weight: 400;
            color: #e2e8f0;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 1.2rem;
            font-family: 'Space Grotesk', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            background: rgba(0, 0, 0, 0.7);
        }

        button {
            background: linear-gradient(135deg, rgba(0,210,255,0.2), rgba(0,150,255,0.1));
            color: white;
            border: 1px solid var(--accent);
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
            width: 100%;
        }

        button:hover, button:active {
            background: rgba(0, 210, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,210,255,0.4);
        }

        #feedback-msg {
            color: #ff5b5b;
            font-size: 1rem;
            margin-top: -10px;
            margin-bottom: 15px;
            opacity: 0;
            transition: opacity 0.3s;
            height: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Final Earth Screen */
        #final-screen {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 2.5s ease-in-out;
            z-index: 100;
            padding: 20px;
        }

        #final-message-container {
            background: rgba(10, 10, 20, 0.85);
            border: 2px solid rgba(255, 105, 180, 0.5); /* Pinkish border */
            border-radius: 25px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(255, 105, 180, 0.2);
            max-width: 600px;
            width: 100%;
            transform: scale(0.9);
            transition: transform 2.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #final-screen.active #final-message-container {
            transform: scale(1);
        }

        #final-message {
            font-size: 2.2rem; /* Scaled down slightly for mobile safety, but still large */
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1.4;
            color: #ffffff;
            text-shadow: 
                0 0 10px #fff, 
                0 0 20px #ff69b4, /* Pink neon glow */
                0 0 40px #ff69b4,
                0 0 80px #ff1493;
            animation: pulseNeon 2s ease-in-out infinite alternate;
        }

        @keyframes pulseNeon {
            from { text-shadow: 0 0 5px #fff, 0 0 15px #ff69b4, 0 0 30px #ff69b4; }
            to { text-shadow: 0 0 15px #fff, 0 0 25px #ff69b4, 0 0 50px #ff69b4, 0 0 100px #ff1493; }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            p { font-size: 1rem; }
            #final-message { font-size: 1.8rem; }
            .panel { padding: 30px 20px; }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/gsap.min.js"></script>
    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <div id="webgl-container"></div>
    
    <div id="ui-layer">
        <!-- Start Screen -->
        <div id="intro-panel" class="panel">
            <h1>Cosmic Journey</h1>
            <p>Welcome to the solar system. Solve the mysteries of the planets to find your destination.</p>
            <button id="start-btn">Begin Journey</button>
        </div>

        <!-- Quiz Panel -->
        <div id="puzzle-panel" class="panel hidden">
            <h1 id="location-name">Location</h1>
            <p id="puzzle-riddle">Riddle goes here.</p>
            <div id="feedback-msg">Incorrect answer. Try again!</div>
            <input type="text" id="puzzle-input" placeholder="Type answer here..." autocomplete="off">
            <button id="submit-btn">Submit Answer</button>
        </div>
    </div>

    <!-- Final Destination Screen -->
    <div id="final-screen">
        <div id="final-message-container">
            <div id="final-message">
                Sarvinoz, Gapam juda mol shuda biraf , boshamishka tel kunit 🙃
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- Game Configuration & Stages ---
        const gameStages = [
            {
                id: 'jupiter',
                name: 'Jupiter',
                riddle: "Let's start easy! What is 5 + 5?",
                answer: '10',
                pos: new THREE.Vector3(0, 0, 0), // Jupiter is at the origin
                camOffset: new THREE.Vector3(0, 5, 45) // Camera offset to look at Jupiter
            },
            {
                id: 'saturn',
                name: 'Saturn',
                riddle: "Which planet is famous for its beautiful rings?",
                answer: 'saturn',
                pos: new THREE.Vector3(120, 20, -80),
                camOffset: new THREE.Vector3(0, 10, 45)
            },
            {
                id: 'moon',
                name: 'The Moon',
                riddle: "I glow in the night sky and orbit the Earth. What am I?",
                answer: 'moon',
                pos: new THREE.Vector3(220, -10, -150),
                camOffset: new THREE.Vector3(0, 5, 20)
            },
            {
                id: 'earth',
                name: 'Earth',
                isFinal: true,
                pos: new THREE.Vector3(300, 10, -220),
                camOffset: new THREE.Vector3(0, 5, 30)
            }
        ];

        let currentStageIndex = 0;

        // --- DOM Elements ---
        const introPanel = document.getElementById('intro-panel');
        const startBtn = document.getElementById('start-btn');
        const puzzlePanel = document.getElementById('puzzle-panel');
        const locationNameUI = document.getElementById('location-name');
        const puzzleRiddle = document.getElementById('puzzle-riddle');
        const puzzleInput = document.getElementById('puzzle-input');
        const submitBtn = document.getElementById('submit-btn');
        const feedbackMsg = document.getElementById('feedback-msg');
        const finalScreen = document.getElementById('final-screen');

        // --- Three.js Initialization ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        
        // Initial setup: Look at Jupiter
        const initialLookAt = new THREE.Vector3(0, 0, 0);
        camera.position.copy(gameStages[0].camOffset);
        camera.lookAt(initialLookAt);

        // Custom proxy object for GSAP to tween the lookAt target smoothly
        const currentLookAt = new THREE.Vector3(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.1);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
        sunLight.position.set(-200, 100, 100); // Light coming from top-left
        scene.add(sunLight);

        // --- Environment Creation ---

        // 1. Starfield
        function createStars() {
            const particleCount = 10000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                positions[i3] = (Math.random() - 0.5) * 1500;
                positions[i3 + 1] = (Math.random() - 0.5) * 1500;
                positions[i3 + 2] = (Math.random() - 0.5) * 1500;
                sizes[i] = Math.random() * 2;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 1.5,
                sizeAttenuation: true,
                transparent: true,
                opacity: 0.8
            });

            const stars = new THREE.Points(geometry, material);
            scene.add(stars);
        }
        createStars();

        // 2. Planets Generation
        const bodies = {};

        // Procedural Texture Generator
        function createTexture(baseHex, detailHex, isStriped) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = baseHex;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = detailHex;
            for(let i=0; i<500; i++) {
                if (isStriped) {
                    ctx.globalAlpha = Math.random() * 0.4;
                    const y = Math.random() * canvas.height;
                    const h = Math.random() * 15 + 5;
                    ctx.fillRect(0, y, canvas.width, h);
                } else {
                    ctx.globalAlpha = Math.random() * 0.15;
                    ctx.beginPath();
                    ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*15, 0, Math.PI*2);
                    ctx.fill();
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        // Jupiter
        const jupTex = createTexture('#a67c52', '#d9bda5', true);
        const jupiter = new THREE.Mesh(
            new THREE.SphereGeometry(18, 64, 64),
            new THREE.MeshStandardMaterial({ map: jupTex, roughness: 0.8 })
        );
        jupiter.position.copy(gameStages[0].pos);
        scene.add(jupiter);
        bodies['jupiter'] = jupiter;

        // Saturn
        const satTex = createTexture('#d4c39c', '#e3d6b8', true);
        const saturn = new THREE.Mesh(
            new THREE.SphereGeometry(14, 64, 64),
            new THREE.MeshStandardMaterial({ map: satTex, roughness: 0.7 })
        );
        saturn.position.copy(gameStages[1].pos);
        
        // Saturn Rings
        const ringGeo = new THREE.RingGeometry(18, 30, 64);
        const ringMat = new THREE.MeshStandardMaterial({ 
            color: 0xc4b494, 
            side: THREE.DoubleSide, 
            transparent: true, 
            opacity: 0.9,
            roughness: 0.5
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2 + 0.3;
        saturn.add(ring);
        scene.add(saturn);
        bodies['saturn'] = saturn;

        // Moon
        const moonTex = createTexture('#888888', '#555555', false);
        const moon = new THREE.Mesh(
            new THREE.SphereGeometry(5, 64, 64),
            new THREE.MeshStandardMaterial({ map: moonTex, roughness: 1.0 })
        );
        moon.position.copy(gameStages[2].pos);
        scene.add(moon);
        bodies['moon'] = moon;

        // Earth
        const earthTex = createTexture('#1a5b9c', '#298c41', false); 
        const earth = new THREE.Mesh(
            new THREE.SphereGeometry(12, 64, 64),
            new THREE.MeshStandardMaterial({ map: earthTex, roughness: 0.5 })
        );
        earth.position.copy(gameStages[3].pos);

        // Earth Atmosphere Glow
        const atmos = new THREE.Mesh(
            new THREE.SphereGeometry(12.5, 32, 32),
            new THREE.MeshBasicMaterial({
                color: 0x4488ff,
                transparent: true,
                opacity: 0.2,
                blending: THREE.AdditiveBlending
            })
        );
        earth.add(atmos);
        scene.add(earth);
        bodies['earth'] = earth;


        // --- Game Logic & Interactions ---

        function flyToStage(index) {
            const stage = gameStages[index];
            const targetPos = stage.pos;
            
            // Calculate where camera should end up
            const destCam = new THREE.Vector3().copy(targetPos).add(stage.camOffset);

            // Animate Camera Position
            gsap.to(camera.position, {
                x: destCam.x,
                y: destCam.y,
                z: destCam.z,
                duration: 3.5,
                ease: "power2.inOut"
            });

            // Animate Camera LookAt Target
            gsap.to(currentLookAt, {
                x: targetPos.x,
                y: targetPos.y,
                z: targetPos.z,
                duration: 3.5,
                ease: "power2.inOut",
                onComplete: () => {
                    if (stage.isFinal) {
                        // Show final romantic message
                        finalScreen.style.pointerEvents = 'auto';
                        finalScreen.style.opacity = '1';
                        finalScreen.classList.add('active');
                    } else {
                        // Show next puzzle
                        locationNameUI.innerText = stage.name;
                        puzzleRiddle.innerText = stage.riddle;
                        puzzleInput.value = '';
                        puzzlePanel.classList.remove('hidden');
                        setTimeout(() => puzzleInput.focus(), 100);
                    }
                }
            });
        }

        function checkAnswer() {
            const stage = gameStages[currentStageIndex];
            const ans = puzzleInput.value.trim().toLowerCase();
            
            if (ans === stage.answer) {
                // Correct! Hide panel and go to next
                feedbackMsg.style.opacity = '0';
                puzzlePanel.classList.add('hidden');
                
                currentStageIndex++;
                flyToStage(currentStageIndex);
            } else {
                // Incorrect
                feedbackMsg.style.opacity = '1';
                // Shake effect on the panel
                gsap.fromTo(puzzlePanel, 
                    { x: -10 }, 
                    { x: 10, duration: 0.1, yoyo: true, repeat: 3, onComplete: () => {
                        gsap.to(puzzlePanel, {x: 0, duration: 0.1});
                    }}
                );
            }
        }

        // Event Listeners
        startBtn.addEventListener('click', () => {
            introPanel.classList.add('hidden');
            // Already looking at Jupiter, just show its quiz
            setTimeout(() => {
                locationNameUI.innerText = gameStages[0].name;
                puzzleRiddle.innerText = gameStages[0].riddle;
                puzzlePanel.classList.remove('hidden');
                puzzleInput.focus();
            }, 600);
        });

        submitBtn.addEventListener('click', checkAnswer);
        puzzleInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });


        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Rotate planets slowly
            jupiter.rotation.y += 0.002;
            saturn.rotation.y += 0.003;
            moon.rotation.y += 0.001;
            earth.rotation.y += 0.004;

            // Apply camera lookAt continuously so it smoothly follows the GSAP tween
            camera.lookAt(currentLookAt);

            renderer.render(scene, camera);
        }

        animate();

        // --- Window Resize Handling ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
